apiVersion: apps/v1
kind: Deployment
metadata: {name: ai-service, namespace: smart-farm}
spec:
  replicas: 2
  selector: {matchLabels: {app: ai-service}}
  template:
    metadata: {labels: {app: ai-service}}
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/example/smart-farm-ai-service:latest
          ports: [{containerPort: 8000}]
          resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: '1', memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: ai-service, namespace: smart-farm}
spec: {selector: {app: ai-service}, ports: [{port: 8000, targetPort: 8000}]}

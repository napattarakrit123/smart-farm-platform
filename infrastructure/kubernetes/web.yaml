apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: smart-farm}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: web, image: ghcr.io/example/smart-farm-web:latest, ports: [{containerPort: 3000}]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: smart-farm}
spec: {selector: {app: web}, ports: [{port: 80, targetPort: 3000}], type: ClusterIP}

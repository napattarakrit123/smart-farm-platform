apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: smart-farm, namespace: smart-farm, annotations: {nginx.ingress.kubernetes.io/proxy-body-size: 10m}}
spec:
  rules:
    - host: smartfarm.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: api, port: {number: 3001}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {number: 80}}}

apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: smart-farm}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/example/smart-farm-api:latest
          ports: [{containerPort: 3001}]
          envFrom: [{secretRef: {name: smart-farm-secrets}}]
          readinessProbe: {httpGet: {path: /api/health, port: 3001}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: smart-farm}
spec: {selector: {app: api}, ports: [{port: 3001, targetPort: 3001}]}
